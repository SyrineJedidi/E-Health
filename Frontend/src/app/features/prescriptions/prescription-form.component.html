<div class="ehealth-page ehealth-rx-form container-fluid py-3 py-md-4" style="max-width: 900px">
  <h1 class="ehealth-page__title h3 mb-4">
    {{ isEditMode ? 'Modifier l’ordonnance' : 'Nouvelle ordonnance' }}
  </h1>

  <div *ngIf="refsLoading" class="ehealth-page__loading text-center py-4">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="text-muted mt-2 mb-0 small">Chargement des listes patient / médecin…</p>
  </div>
  <div *ngIf="prescriptionLoading" class="ehealth-page__loading text-center py-4">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="text-muted mt-2 mb-0 small">Chargement de l’ordonnance…</p>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <form *ngIf="!refsLoading && !prescriptionLoading" [formGroup]="form" (ngSubmit)="submit()" class="card shadow-sm ehealth-rx-form__card">
    <div class="card-body">
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label" for="patientId">Patient *</label>
          <select id="patientId" class="form-select" formControlName="patientId">
            <option [ngValue]="null">— Choisir —</option>
            <option *ngFor="let p of patients" [ngValue]="p.id">
              {{ p.prenom }} {{ p.nom }} (id {{ p.id }})
            </option>
          </select>
        </div>
        <div class="col-md-6" *ngIf="!cabinetMode">
          <label class="form-label" for="doctorId">Médecin *</label>
          <select id="doctorId" class="form-select" formControlName="doctorId">
            <option [ngValue]="null">— Choisir —</option>
            <option *ngFor="let d of doctors" [ngValue]="d.id">
              Dr {{ d.prenom }} {{ d.nom }} — {{ d.specialite }} (id {{ d.id }})
            </option>
          </select>
        </div>
        <div class="col-md-6" *ngIf="cabinetMode && doctors.length">
          <label class="form-label">Médecin prescripteur</label>
          <p class="form-control-plaintext border rounded px-3 py-2 bg-light small mb-0">
            Dr {{ doctors[0].prenom }} {{ doctors[0].nom }} — {{ doctors[0].specialite }}
          </p>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="status">Statut *</label>
          <select id="status" class="form-select" formControlName="status">
            <option *ngFor="let s of statusOptions" [ngValue]="s">{{ s }}</option>
          </select>
        </div>
      </div>

      <h2 class="h6 text-secondary mb-2">Médicaments *</h2>
      <div formArrayName="medications" class="d-flex flex-column gap-3">
        <div
          *ngFor="let group of medications.controls; let i = index"
          [formGroupName]="i"
          class="border rounded p-3 bg-light">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="fw-medium">Médicament {{ i + 1 }}</span>
            <button
              type="button"
              class="btn btn-outline-danger btn-sm"
              (click)="removeMedication(i)"
              [disabled]="medications.length <= 1">
              Retirer
            </button>
          </div>
          <div class="row g-2">
            <div class="col-md-6">
              <label class="form-label small" [attr.for]="'med-cat-' + i">Catalogue</label>
              <select
                [id]="'med-cat-' + i"
                class="form-select form-select-sm"
                formControlName="medicationId"
                (change)="onMedicationCatalogChange(i)">
                <option [ngValue]="null">— Saisie libre du nom —</option>
                <option *ngFor="let c of medicationCatalog" [ngValue]="c.id">{{ c.name }}</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small" [attr.for]="'med-name-' + i">Nom (si pas du catalogue)</label>
              <input [id]="'med-name-' + i" class="form-control form-control-sm" formControlName="name" />
            </div>
            <div class="col-md-6">
              <label class="form-label small" [attr.for]="'med-dosage-' + i">Posologie *</label>
              <input [id]="'med-dosage-' + i" class="form-control form-control-sm" formControlName="dosage" />
            </div>
            <div class="col-md-6">
              <label class="form-label small" [attr.for]="'med-freq-' + i">Fréquence *</label>
              <input [id]="'med-freq-' + i" class="form-control form-control-sm" formControlName="frequency" />
            </div>
            <div class="col-md-6">
              <label class="form-label small" [attr.for]="'med-dur-' + i">Durée (jours)</label>
              <input
                [id]="'med-dur-' + i"
                type="number"
                min="1"
                class="form-control form-control-sm"
                formControlName="durationDays" />
            </div>
            <div class="col-12">
              <label class="form-label small" [attr.for]="'med-inst-' + i">Instructions</label>
              <input [id]="'med-inst-' + i" class="form-control form-control-sm" formControlName="instructions" />
            </div>
          </div>
        </div>
      </div>

      <button type="button" class="btn btn-outline-secondary btn-sm mt-2" (click)="addMedication()">
        + Ajouter un médicament
      </button>

      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary" [disabled]="saving">
          {{ saving ? 'Enregistrement…' : isEditMode ? 'Enregistrer' : 'Créer' }}
        </button>
        <button type="button" class="btn btn-outline-secondary" (click)="cancel()" [disabled]="saving">Annuler</button>
      </div>
    </div>
  </form>
</div>
