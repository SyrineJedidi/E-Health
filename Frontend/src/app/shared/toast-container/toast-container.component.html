<div class="ehealth-toast-container" role="region" aria-label="Notifications">
  @for (t of toasts$ | async; track t.id) {
    <div
      class="ehealth-toast ehealth-toast--animate"
      [ngClass]="'ehealth-toast--' + t.variant"
      role="alert">
      <span class="ehealth-toast__message">{{ t.message }}</span>
      <button type="button" class="ehealth-toast__close" (click)="dismiss(t.id)" aria-label="Fermer">
        ×
      </button>
    </div>
  }
</div>
