<div class="ehealth-placeholder container py-4 py-md-5">
  <div class="ehealth-placeholder__card card border-0 shadow-sm mx-auto" style="max-width: 520px">
    <div class="card-body p-4 p-md-5 text-center">
      <div class="ehealth-placeholder__icon mb-3" aria-hidden="true">
        <i class="bi bi-hospital"></i>
      </div>
      <h2 class="ehealth-placeholder__title h4 mb-3">Section en préparation</h2>
      <p class="ehealth-placeholder__text text-muted mb-4">
        Cette partie sera reliée au microservice correspondant. L’interface suit le même design que le reste de la
        plateforme eHealth.
      </p>
      <a [routerLink]="backLink" class="btn btn-primary">{{ backLabel }}</a>
    </div>
  </div>
</div>
