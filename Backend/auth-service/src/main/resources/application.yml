spring:
  application:
    name: auth-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/auth_db

server:
  port: 8088

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: eHealthSecretKey2024VeryLongSecretKeyForJWTGenerationAtLeast256BitsLong
  expiration-ms: 86400000

# En production : false + envoi du jeton par email uniquement.
ehealth:
  auth:
    expose-reset-token: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
