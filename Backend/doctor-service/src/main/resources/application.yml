spring:
  application:
    name: doctor-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:h2:mem:doctordb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    # Obligatoire avec data.sql : Hibernate crée le schéma avant l’insertion des données.
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
  rabbitmq:
    host: localhost
    port: 5673
    username: guest
    password: guest

server:
  port: 8086
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# Même secret HS256 que patient-service / auth-service / prescription-service
jwt:
  secret: eHealthSecretKey2024VeryLongSecretKeyForJWTGenerationAtLeast256BitsLong

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Swagger UI : http://localhost:8086/swagger-ui.html  (chemins autorisés dans SecurityConfig)
springdoc:
  swagger-ui:
    operationsSorter: method

# Portail /api/doctors/me : si compte auth avec rôle DOCTOR mais pas encore de ligne dans « doctors »,
# création automatique d’une fiche (spécialité par défaut). Désactiver en prod si vous préférez du contrôle manuel.
ehealth:
  doctor:
    portal:
      auto-provision-doctor: true
      default-specialty-id: 2
  # RabbitMQ : scénario patient → doctor (consommation) + publication profil médecin
  messaging:
    exchange: ehealth.topic
    routing:
      doctor-profile: ehealth.routing.doctor.profile
      patient-registered: ehealth.routing.patient.registered
      patient-profile-updated: ehealth.routing.patient.profile.updated
    queues:
      doctor-ingest-patient: q.doctor.ingest.patient
      doctorIngestPatientProfile: q.doctor.ingest.patient.profile
