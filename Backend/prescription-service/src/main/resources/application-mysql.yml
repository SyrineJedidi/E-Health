# Profil : mysql
# Usage : --spring.profiles.active=mysql
# Adapter username / password selon votre instance MySQL.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/prescriptiondb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  h2:
    console:
      enabled: false
