# Par défaut : H2 en mémoire → aucun MySQL requis (idéal pour le dev local).
# Pour MySQL : lancer avec --spring.profiles.active=mysql
spring:
  config:
    import: optional:configserver:http://localhost:8888
  application:
    name: prescription-service
  datasource:
    url: jdbc:h2:mem:prescriptiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

server:
  port: 8083
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: eHealthSecretKey2024VeryLongSecretKeyForJWTGenerationAtLeast256BitsLong
