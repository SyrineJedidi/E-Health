spring:
  application:
    name: patient-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:h2:mem:patientdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    defer-datasource-initialization: true
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
  rabbitmq:
    host: localhost
    port: 5673
    username: guest
    password: guest

server:
  # 8091 : évite les conflits avec une autre appli sur 8081 (surcharge : SERVER_PORT ou variable d’env)
  port: ${SERVER_PORT:8091}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Même secret que auth-service (JWT HS256) — ressource sécurisée
jwt:
  secret: eHealthSecretKey2024VeryLongSecretKeyForJWTGenerationAtLeast256BitsLong

feign:
  circuitbreaker:
    enabled: true

# RabbitMQ : scénario doctor → patient (consommation) + publication inscription patient
ehealth:
  messaging:
    exchange: ehealth.topic
    routing:
      doctor-profile: ehealth.routing.doctor.profile
      patient-registered: ehealth.routing.patient.registered
      patient-profile-updated: ehealth.routing.patient.profile.updated
    queues:
      patient-ingest-doctor: q.patient.ingest.doctor
      # Mêmes noms que doctor-service : topologie créée côté patient pour ne pas perdre les messages
      # si doctor-service démarre plus tard (files durables sur RabbitMQ).
      doctor-ingest-patient: q.doctor.ingest.patient
      doctorIngestPatientProfile: q.doctor.ingest.patient.profile
